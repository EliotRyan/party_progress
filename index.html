<div class="hd">
  <img src="logo.png" alt="" class="hd-logo">
  <div class="hd-t"><h1>入党积极分子电子档案</h1><div class="sub">中国人民大学应用经济学院 · 本科第一党支部</div></div>
  <span class="admin-name" id="adminName"></span>
  <button class="hd-btn" id="adminBtn">管理</button>
</div>

<!-- STUDENT VIEW -->
<div id="sView" class="ct">
  <div class="bn" id="banner"></div>
  <div class="cd"><h2>查询入党流程进度</h2>
    <div class="fg"><label>姓名 <span class="rq">*</span></label><input class="fi" id="nameIn" placeholder="请输入姓名"><div class="fie" id="nameErr">请输入姓名</div></div>
    <div class="fg" id="idGrp"><label>学号（10位）<span class="rq">*</span></label><input class="fi" id="idIn" placeholder="请输入学号" maxlength="10" inputmode="numeric"><div class="fie" id="idErr">请输入10位学号</div></div>
    <button class="bt bt-p bt-bl" id="searchBtn" disabled>查 询</button>
  </div>
  <div id="res"></div>
  <div class="ft">数据仅在浏览器中处理，不会上传至任何服务器。</div>
</div>

<!-- ADMIN VIEW -->

  </div>
  <div class="tp ac" id="tRec">
    <div class="atl">
      <input type="text" class="si" id="aSearch" placeholder="搜索姓名/学号…">

      <select id="fStage"><option value="">全部阶段</option><option value="0">未提交申请</option><option value="1">已提交申请</option><option value="2">已推优</option><option value="3">积极分子</option><option value="4">发展对象</option><option value="5">预备党员</option><option value="6">正式党员</option></select>
      <button class="bt bt-sm bt-s" id="addBtn">➕ 新增</button>
      <button class="bt bt-sm bt-s" id="exportBtn">📥 导出</button>
      <button class="bt bt-sm bt-g" id="saveAll">💾 保存</button>
    </div>
    <div id="bBar"></div>
    <div class="dtw" id="tWrap"></div>
  </div>
  <div class="tp" id="tImp"><div class="cd"><h2>导入 xlsx</h2>
    <div class="radio-group"><label><input type="radio" name="impMode" value="append" checked> 追加导入（保留已有数据）</label><label id="impOwLabel"><input type="radio" name="impMode" value="overwrite"> 完全覆盖</label></div>

<div class="ov" id="loginOv"><div class="md"><button class="md-x" id="loginX">✕</button><h3>管理员登录</h3><div class="fg"><label>学号</label><input class="fi" id="lId" maxlength="10"></div><div class="fg"><label>密码</label><input type="password" class="fi" id="lPwd"></div><button class="bt bt-p bt-bl" id="lBtn">登录</button><div class="mm" id="lMsg"></div></div></div>

<script>
(function(){
var FIELDS=[
  {k:'姓名',l:'姓名',t:'text'},{k:'学号',l:'学号',t:'text'},{k:'所在支部',l:'所在支部',t:'text'},
  {k:'入党申请书日期',l:'申请书日期',t:'date'},{k:'入党申请书页数',l:'申请书页数',t:'text'},
  {k:'团支部推优日期',l:'推优日期',t:'date'},{k:'确定积极分子日期',l:'积极分子日期',t:'date'},
  {k:'确定发展对象日期',l:'发展对象日期',t:'date'},{k:'预备党员日期',l:'预备党员日期',t:'date'},
  {k:'正式党员日期',l:'正式党员日期',t:'date'},
  {k:'院党校培训',l:'院党校',t:'select',o:['','是']},{k:'校党校培训',l:'校党校',t:'select',o:['','是']}
];
var BFIELDS=FIELDS.filter(function(f){return f.k!=='姓名'&&f.k!=='学号'});
var ROLES={super:'超级管理员',secretary:'党支部书记',contact:'党务联系人'};
var STAGES=['未提交申请','已提交申请','已推优','积极分子','发展对象','预备党员','正式党员'];
var DATE_KEYS={'入党申请书日期':1,'团支部推优日期':1,'确定积极分子日期':1,'确定发展对象日期':1,'预备党员日期':1,'正式党员日期':1};

var DATA=[],ADMINS=[],CUR=null,editIdx=-1,sortCol='',sortAsc=true;
async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
var $=document.getElementById.bind(document);
function sm(el,t,c){el.className='mm '+c;el.textContent=t}
function sbn(t,c){var b=$('banner');b.className='bn sh '+c;b.textContent=t}

function getStage(r){
  if(v(r,'正式党员日期'))return 6;if(v(r,'预备党员日期'))return 5;if(v(r,'确定发展对象日期'))return 4;
  if(v(r,'确定积极分子日期'))return 3;if(v(r,'团支部推优日期'))return 2;if(v(r,'入党申请书日期'))return 1;return 0;
}

/* AUTO LOAD */
(async function(){sbn('正在加载…','ld');try{var r=await fetch('data.xlsx',{cache:'no-cache'});if(!r.ok)throw 0;px(await r.arrayBuffer());sbn('✓ 已加载 '+DATA.length+' 条','ok');setTimeout(function(){$('banner').classList.remove('sh')},2500)}catch(e){sbn('加载失败','fl')}})();
(async function(){try{var r=await fetch('admins.json',{cache:'no-cache'});if(r.ok)ADMINS=await r.json()}catch(e){ADMINS=[]}})();

function px(buf){var wb=XLSX.read(buf,{type:'array',cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]],j=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});DATA=j.map(function(r){var c={};for(var k in r)c[k.trim()]=String(r[k]).trim();return c});$('searchBtn').disabled=false}

/* LOGIN */
$('adminBtn').onclick=function(){if(CUR){CUR=null;$('adminBtn').textContent='管理';$('adminBtn').classList.remove('on');$('adminName').textContent='';$('aView').style.display='none';$('sView').style.display='block';$('idGrp').style.display=''}else{$('loginOv').classList.add('op');$('lId').focus()}};
$('loginX').onclick=function(){$('loginOv').classList.remove('op')};$('loginOv').onclick=function(e){if(e.target===$('loginOv'))$('loginOv').classList.remove('op')};
$('lBtn').onclick=doLogin;$('lPwd').onkeydown=function(e){if(e.key==='Enter')doLogin()};
async function doLogin(){var id=$('lId').value.trim(),pw=$('lPwd').value;if(!id||!pw){sm($('lMsg'),'请填写完整','er');return}var h=await sha(pw),adm=null;for(var i=0;i<ADMINS.length;i++){if(ADMINS[i].id===id&&ADMINS[i].pwdHash===h){adm=ADMINS[i];break}}if(!adm){sm($('lMsg'),'学号或密码错误','er');$('lPwd').value='';return}CUR=adm;$('loginOv').classList.remove('op');$('lId').value='';$('lPwd').value='';$('lMsg').className='mm';$('adminBtn').textContent='退出管理';$('adminBtn').classList.add('on');$('adminName').textContent=CUR.name+' · '+ROLES[CUR.role];$('sView').style.display='none';$('aView').style.display='block';$('idGrp').style.display='none';$('tabAdm').style.display=CUR.role==='super'?'':'none';setupImportTab();populateBranches();rTable();rStats();lCfg();if(CUR.role==='super')rAdmins()}

/* TABS */
document.querySelectorAll('.at').forEach(function(t){t.onclick=function(){document.querySelectorAll('.at').forEach(function(x){x.classList.remove('ac')});document.querySelectorAll('.tp').forEach(function(x){x.classList.remove('ac')});t.classList.add('ac');$(t.dataset.t).classList.add('ac');if(t.dataset.t==='tImp')setupImportTab()}});

/* STATS */
function rStats(){
  var total=0,stages=[0,0,0,0,0,0,0],branches={};
  DATA.forEach(function(r){if(!canEdit(r))return;total++;var s=getStage(r);stages[s]++;var br=r['所在支部']||'未分配';branches[br]=(branches[br]||0)+1});
  var h='<div class="stat-item"><div class="sv">'+total+'</div><div class="sl">总人数</div></div>';
  STAGES.forEach(function(name,i){if(stages[i])h+='<div class="stat-item"><div class="sv">'+stages[i]+'</div><div class="sl">'+name+'</div></div>'});
  $('statBar').innerHTML=h;
}

/* BRANCHES DROPDOWN */
function populateBranches(){
  var bs={},sel=$('fBranch');DATA.forEach(function(r){var b=r['所在支部'];if(b)bs[b]=1});
  sel.innerHTML='<option value="">全部支部</option>';Object.keys(bs).sort().forEach(function(b){sel.innerHTML+='<option value="'+es(b)+'">'+es(b)+'</option>'});
}

/* TABLE */
function canEdit(r){if(!CUR)return false;if(CUR.role==='super'||CUR.role==='secretary')return true;return r['所在支部']===CUR.scope}
function setupImportTab(){var ow=$('impOwLabel');if(!ow)return;if(CUR&&CUR.role!=='super'){ow.style.display='none';var app=document.querySelector('input[name="impMode"][value="append"]');if(app)app.checked=true}else{ow.style.display=''}}

function rTable(){
  var q=($('aSearch').value||'').toLowerCase(),fb=$('fBranch').value,fs=$('fStage').value;
  var rows=[];DATA.forEach(function(r,i){if(!canEdit(r))return;if(q&&(r['姓名']+' '+r['学号']).toLowerCase().indexOf(q)<0)return;if(fb&&r['所在支部']!==fb)return;var s=getStage(r);if(fs!==''&&s!==+fs)return;r.__i=i;rows.push(r)});
  if(sortCol){rows.sort(function(a,b){var va=a[sortCol]||'',vb=b[sortCol]||'';if(va<vb)return sortAsc?-1:1;if(va>vb)return sortAsc?1:-1;return 0})}
  var cols=[{k:'姓名',l:'姓名'},{k:'学号',l:'学号'},{k:'所在支部',l:'支部'},{k:'__stage',l:'阶段'},{k:'入党申请书日期',l:'申请书'},{k:'团支部推优日期',l:'推优'},{k:'确定积极分子日期',l:'积极分子'},{k:'确定发展对象日期',l:'发展对象'},{k:'预备党员日期',l:'预备'},{k:'正式党员日期',l:'正式'},{k:'院党校培训',l:'院校'},{k:'校党校培训',l:'校校'}];
  var h='<table class="dt"><thead><tr><th class="ck"><input type="checkbox" id="ckA"></th>';
  cols.forEach(function(c){var arrow=sortCol===c.k?(sortAsc?'↑':'↓'):'';h+='<th data-sk="'+c.k+'">'+c.l+(arrow?'<span class="so">'+arrow+'</span>':'')+'</th>'});
  h+='<th class="op">操作</th></tr></thead><tbody>';
  rows.forEach(function(r){var i=r.__i,s=getStage(r);
    h+='<tr><td class="ck"><input type="checkbox" class="rcb" data-i="'+i+'"></td>';
    h+='<td>'+es(r['姓名']||'')+'</td><td>'+es(r['学号']||'')+'</td><td>'+es(r['所在支部']||'')+'</td>';
    h+='<td><span class="stg stg-'+s+'">'+STAGES[s]+'</span></td>';
    h+='<td>'+es(toCN(r['入党申请书日期'])||'-')+'</td><td>'+es(toCN(r['团支部推优日期'])||'-')+'</td>';
    h+='<td>'+es(toCN(r['确定积极分子日期'])||'-')+'</td><td>'+es(toCN(r['确定发展对象日期'])||'-')+'</td>';
    h+='<td>'+es(toCN(r['预备党员日期'])||'-')+'</td><td>'+es(toCN(r['正式党员日期'])||'-')+'</td>';
    h+='<td>'+(r['院党校培训']==='是'?'<span class="bp">✓</span>':'-')+'</td>';
    h+='<td>'+(r['校党校培训']==='是'?'<span class="bp">✓</span>':'-')+'</td>';
    h+='<td class="op"><button class="bt bt-sm bt-s edb" data-i="'+i+'">编辑</button> <button class="bt bt-sm bt-d delb" data-i="'+i+'">删除</button></td></tr>'});
  h+='</tbody></table>';$('tWrap').innerHTML=h;uBB();
  $('ckA')&&($('ckA').onchange=function(){$('tWrap').querySelectorAll('.rcb').forEach(function(c){c.checked=$('ckA').checked});uBB()});
  $('tWrap').querySelectorAll('.rcb').forEach(function(c){c.onchange=uBB});
  $('tWrap').querySelectorAll('.edb').forEach(function(b){b.onclick=function(){oEdit(+b.dataset.i)}});
  $('tWrap').querySelectorAll('.delb').forEach(function(b){b.onclick=function(){if(confirm('确定删除 '+DATA[+b.dataset.i]['姓名']+' ？')){DATA.splice(+b.dataset.i,1);rTable();rStats()}}});
  $('tWrap').querySelectorAll('.dt th[data-sk]').forEach(function(th){th.onclick=function(){var sk=th.dataset.sk;if(sk==='__stage')return;if(sortCol===sk)sortAsc=!sortAsc;else{sortCol=sk;sortAsc=true}rTable()}});
}
$('aSearch').oninput=rTable;$('fBranch').onchange=rTable;$('fStage').onchange=rTable;

function gSel(){var s=[];$('tWrap').querySelectorAll('.rcb:checked').forEach(function(c){s.push(+c.dataset.i)});return s}
function uBB(){var s=gSel(),bb=$('bBar');if(!s.length){bb.innerHTML='';return}
  var h='<div class="bb"><span>已选 <b>'+s.length+'</b> 人</span><select id="bF">';BFIELDS.forEach(function(f){h+='<option value="'+f.k+'" data-t="'+f.t+'">'+f.l+'</option>'});h+='</select><input type="date" id="bV" class="fi" style="width:150px"><button class="bt bt-sm bt-g" id="bA">应用</button><button class="bt bt-sm bt-d" id="bDel">批量删除</button><button class="bt bt-sm bt-s" id="bC">取消</button></div>';
  bb.innerHTML=h;
  var bfS=$('bF'),bvI=$('bV');
  function sync(){var o=bfS.options[bfS.selectedIndex],ft=o.dataset.t;if(ft==='date'){bvI.type='date';bvI.placeholder=''}else if(ft==='select'){bvI.type='text';bvI.placeholder='填「是」'}else{bvI.type='text';bvI.placeholder='新值'}}sync();bfS.onchange=sync;
  $('bA').onclick=function(){var fk=bfS.value,fv=bvI.value;s.forEach(function(i){DATA[i][fk]=fv});rTable();rStats()};
  $('bDel').onclick=function(){if(!confirm('确定删除选中的 '+s.length+' 条记录？'))return;s.sort(function(a,b){return b-a}).forEach(function(i){DATA.splice(i,1)});rTable();rStats()};
  $('bC').onclick=function(){$('tWrap').querySelectorAll('.rcb').forEach(function(c){c.checked=false});if($('ckA'))$('ckA').checked=false;uBB()};
}

/* EDIT */
function oEdit(i){editIdx=i;var row=DATA[i];$('editTi').textContent='编辑：'+row['姓名'];
  $('editFs').innerHTML=FIELDS.map(function(f){var val=row[f.k]||'';if(f.t==='select')return'<div class="fg"><label>'+f.l+'</label><select class="fi fi-sel efi" data-k="'+f.k+'">'+f.o.map(function(o){return'<option'+(val===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select></div>';if(f.t==='date')return'<div class="fg"><label>'+f.l+'</label><input type="date" class="fi efi" data-k="'+f.k+'" value="'+toISO(val)+'"></div>';return'<div class="fg"><label>'+f.l+'</label><input class="fi efi" data-k="'+f.k+'" value="'+es(val)+'"></div>'}).join('');
  $('editOv').classList.add('op')}
$('editX').onclick=function(){$('editOv').classList.remove('op')};$('editOv').onclick=function(e){if(e.target===$('editOv'))$('editOv').classList.remove('op')};
$('editSv').onclick=function(){$('editOv').querySelectorAll('.efi').forEach(function(el){DATA[editIdx][el.dataset.k]=el.value});$('editOv').classList.remove('op');rTable();rStats()};

/* ADD */
$('addBtn').onclick=function(){
  $('addFs').innerHTML=FIELDS.map(function(f){if(f.t==='select')return'<div class="fg"><label>'+f.l+'</label><select class="fi fi-sel afi" data-k="'+f.k+'">'+f.o.map(function(o){return'<option>'+o+'</option>'}).join('')+'</select></div>';if(f.t==='date')return'<div class="fg"><label>'+f.l+'</label><input type="date" class="fi afi" data-k="'+f.k+'"></div>';return'<div class="fg"><label>'+f.l+'</label><input class="fi afi" data-k="'+f.k+'" placeholder="'+f.l+'"></div>'}).join('');
  $('addOv').classList.add('op')};
$('addX').onclick=function(){$('addOv').classList.remove('op')};$('addOv').onclick=function(e){if(e.target===$('addOv'))$('addOv').classList.remove('op')};
$('addSv').onclick=function(){var row={};$('addOv').querySelectorAll('.afi').forEach(function(el){row[el.dataset.k]=el.value});if(!row['姓名']||!row['学号']){alert('请至少填写姓名和学号');return}DATA.push(row);$('addOv').classList.remove('op');populateBranches();rTable();rStats()};

/* EXPORT */
$('exportBtn').onclick=function(){var clean=DATA.map(function(r){var c={};FIELDS.forEach(function(f){c[f.k]=r[f.k]||''});return c});var wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(clean);XLSX.utils.book_append_sheet(wb,ws,'data');XLSX.writeFile(wb,'党支部档案_'+new Date().toISOString().slice(0,10)+'.xlsx')};

/* IMPORT */
$('fD').onchange=function(e){if(e.target.files.length)doImp(e.target.files[0])};
$('uzD').ondragover=function(e){e.preventDefault()};$('uzD').ondrop=function(e){e.preventDefault();if(e.dataTransfer.files.length)doImp(e.dataTransfer.files[0])};
function doImp(f){var mode=document.querySelector('input[name="impMode"]:checked').value;if(mode==='overwrite'&&CUR&&CUR.role!=='super'){sm($('impM'),'仅超级管理员可使用完全覆盖','er');return}var r=new FileReader();r.onload=function(e){try{var wb=XLSX.read(e.target.result,{type:'array',cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]],j=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});var nd=j.map(function(r){var c={};for(var k in r)c[k.trim()]=String(r[k]).trim();return c});if(mode==='overwrite'){DATA=nd}else{DATA=DATA.concat(nd)}sm($('impM'),'✓ '+(mode==='overwrite'?'已覆盖':'已追加')+' '+nd.length+' 条，共 '+DATA.length+' 条','ok');$('searchBtn').disabled=false;populateBranches();rTable();rStats()}catch(err){sm($('impM'),'导入失败','er')}};r.readAsArrayBuffer(f)}

/* GITHUB */
function lCfg(){var c=JSON.parse(localStorage.getItem('gh_cfg')||'{}');$('ghU').value=c.user||'';$('ghR').value=c.repo||'';$('ghT').value=c.token||''}
$('saveCfg').onclick=function(){var u=$('ghU').value.trim(),r=$('ghR').value.trim(),t=$('ghT').value.trim();if(!u||!r||!t){sm($('cfgM'),'请填完整','er');return}localStorage.setItem('gh_cfg',JSON.stringify({user:u,repo:r,token:t}));sm($('cfgM'),'✓ 已保存','ok')};
$('shareBtn').onclick=function(){var c=JSON.parse(localStorage.getItem('gh_cfg')||'{}');if(!c.user){sm($('cfgM'),'请先保存','er');return}var code=btoa(unescape(encodeURIComponent(JSON.stringify(c))));$('shareCode').value=code;$('shareBox').style.display='block';try{navigator.clipboard.writeText(code)}catch(e){}sm($('cfgM'),'✓ 已生成','ok')};
$('importBtn').onclick=function(){try{var c=JSON.parse(decodeURIComponent(escape(atob($('importCode').value.trim()))));if(!c.user)throw 0;localStorage.setItem('gh_cfg',JSON.stringify(c));$('ghU').value=c.user;$('ghR').value=c.repo;$('ghT').value=c.token;sm($('importM'),'✓ 导入成功','ok')}catch(e){sm($('importM'),'无效','er')}};
async function pGH(fn,b64){var c=JSON.parse(localStorage.getItem('gh_cfg')||'{}');if(!c.user||!c.repo||!c.token)throw new Error('请先配置GitHub');var api='https://api.github.com/repos/'+c.user+'/'+c.repo+'/contents/'+fn,hd={'Authorization':'token '+c.token,'Accept':'application/vnd.github.v3+json'},sha='';try{var g=await fetch(api,{headers:hd});if(g.ok)sha=(await g.json()).sha}catch(e){}var body={message:'更新'+fn,content:b64};if(sha)body.sha=sha;var resp=await fetch(api,{method:'PUT',headers:hd,body:JSON.stringify(body)});if(!resp.ok){var err=await resp.json();throw new Error(err.message||resp.status)}}
$('saveAll').onclick=async function(){$('saveAll').disabled=true;$('saveAll').textContent='⏳…';try{var clean=DATA.map(function(r){var c={};FIELDS.forEach(function(f){c[f.k]=r[f.k]||''});return c});var wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(clean);XLSX.utils.book_append_sheet(wb,ws,'data');var buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});var b64=btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));await pGH('data.xlsx',b64);$('saveAll').textContent='✓ 已保存';setTimeout(function(){$('saveAll').textContent='💾 保存';$('saveAll').disabled=false},2000)}catch(e){alert('失败：'+e.message);$('saveAll').textContent='💾 保存';$('saveAll').disabled=false}};

/* HELPERS */
function v(r,k){var x=r[k];return(x==null||x===''||x==='—')?'':x}
function toISO(s){if(!s)return'';s=s.replace(/年/g,'-').replace(/月/g,'-').replace(/日/g,'').replace(/\//g,'-').trim();var p=s.split('-').map(Number);if(p.length>=3&&p[0]>0&&p[1]>0&&p[2]>0)return p[0]+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0');return s}
function toCN(s){if(!s||s==='-')return s;var iso=toISO(s);var p=iso.split('-').map(Number);if(p.length>=3&&p[0]>0)return p[0]+'年'+p[1]+'月'+p[2]+'日';return s}
function dvf(r,k){var val=v(r,k);if(!val)return'暂无信息';return DATE_KEYS[k]?toCN(val):val}
function dv(r,k){return v(r,k)||'暂无信息'}
function ep(r,k){return!v(r,k)}
function pd(s){if(!s)return null;s=s.replace(/年/g,'-').replace(/月/g,'-').replace(/日/g,'').replace(/\//g,'-').trim();var p=s.split('-').map(Number);if(p.length>=3&&p[0]>0&&p[1]>0&&p[2]>0)return new Date(p[0],p[1]-1,p[2]);var d=new Date(s);return isNaN(d)?null:d}
function am(d,n){var r=new Date(d);r.setMonth(r.getMonth()+n);return r}
function fm(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}
function es(s){var e=document.createElement('span');e.textContent=s;return e.innerHTML}
